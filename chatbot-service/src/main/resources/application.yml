spring:
  application:
    name: chat-service
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jackson:
    serialization:
      write-dates-as-timestamps: false
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_MODEL:qwen2.5:7b}
          temperature: 0.2
  http:
    client:
      connect-timeout: 5s
      read-timeout: ${quickcart.chat.llm-timeout:90s}   # also applies to the Ollama client

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"

quickcart:
  jwt:
    secret: ${JWT_SECRET}            # secret: no default, min 32 chars (fail fast)
    issuer: quickcart-user-service
  gateway:
    base-url: ${GATEWAY_BASE_URL:http://localhost:8080}
    connect-timeout-ms: 2000
    read-timeout-ms: 5000
  chat:
    # max-message-length: 500
    memory-window: 10
    conversation-ttl: 30m
    max-conversations-per-user: 3
    rate-limit-per-minute: 10
    llm-concurrency: 2
    llm-queue-wait: 20s
    llm-timeout: 90s              # applied to the Ollama HTTP client in B4